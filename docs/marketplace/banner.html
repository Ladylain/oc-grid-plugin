<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
        width: 837px;
        height: 348px;
        overflow: hidden;
        font-family: "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
        color: #fff;
        background: radial-gradient(circle at 12% 18%, #8486ff 0, transparent 45%), linear-gradient(135deg, #5b5df0 0%, #8f5cf2 55%, #c45fd8 100%);
        position: relative;
    }
    .text { position: absolute; left: 44px; top: 50px; width: 330px; }
    .logo { width: 52px; height: 52px; border-radius: 13px; box-shadow: 0 6px 18px rgba(20, 10, 80, .35); }
    h1 { margin: 18px 0 8px; font-size: 46px; line-height: 1; letter-spacing: -1px; font-weight: 800; }
    p { margin: 0 0 18px; font-size: 16px; line-height: 1.4; opacity: .92; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 4px 10px; font-size: 12px; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .3); border-radius: 999px; }
    .shot {
        position: absolute; left: 400px; top: 36px; width: 520px;
        border-radius: 10px; overflow: hidden;
        box-shadow: 0 22px 44px rgba(20, 10, 80, .45), 0 0 0 6px rgba(255, 255, 255, .14);
        transform: perspective(1000px) rotateY(-14deg) rotateX(4deg);
        transform-origin: left center;
    }
    .shot img { display: block; width: 100%; }
</style>
</head>
<body>
    <div class="shot"><img src="../screenshots/02-overlay-sortable.jpg" alt=""></div>
    <div class="text">
        <img class="logo" src="logo.svg" alt="">
        <h1>Grid Cards</h1>
        <p>Your October CMS backend lists, displayed as beautiful cards.</p>
        <div class="chips">
            <span class="chip">Drop-in ListController</span>
            <span class="chip">Filters &amp; bulk actions</span>
            <span class="chip">Drag &amp; drop</span>
            <span class="chip">Dark mode</span>
        </div>
    </div>
</body>
</html>
