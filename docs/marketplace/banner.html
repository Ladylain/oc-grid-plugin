<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
        width: 1600px;
        height: 800px;
        overflow: hidden;
        font-family: "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
        color: #fff;
        background: radial-gradient(circle at 15% 20%, #8486ff 0, transparent 45%), linear-gradient(135deg, #5b5df0 0%, #8f5cf2 55%, #c45fd8 100%);
        position: relative;
    }
    .text { position: absolute; left: 96px; top: 150px; width: 560px; }
    .logo { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 10px 30px rgba(20, 10, 80, .35); }
    h1 { margin: 36px 0 14px; font-size: 84px; line-height: 1; letter-spacing: -2px; font-weight: 800; }
    p { margin: 0 0 34px; font-size: 28px; line-height: 1.4; opacity: .92; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { padding: 8px 16px; font-size: 19px; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .3); border-radius: 999px; }
    .shot {
        position: absolute; left: 740px; top: 90px; width: 1000px;
        border-radius: 18px; overflow: hidden;
        box-shadow: 0 40px 80px rgba(20, 10, 80, .45), 0 0 0 10px rgba(255, 255, 255, .14);
        transform: perspective(1800px) rotateY(-14deg) rotateX(4deg);
        transform-origin: left center;
    }
    .shot img { display: block; width: 100%; }
</style>
</head>
<body>
    <div class="shot"><img src="../screenshots/02-showcase-overlay-sortable.jpg" alt=""></div>
    <div class="text">
        <img class="logo" src="logo.svg" alt="">
        <h1>Grid Cards</h1>
        <p>Your October CMS backend lists, displayed as beautiful cards.</p>
        <div class="chips">
            <span class="chip">Drop-in ListController</span>
            <span class="chip">Filters &amp; bulk actions</span>
            <span class="chip">Drag &amp; drop</span>
            <span class="chip">Dark mode</span>
        </div>
    </div>
</body>
</html>
